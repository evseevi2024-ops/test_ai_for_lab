# ============================================================
# snmpd.conf — конфиг SNMP-агента на подхосте (ВМ 2)
# Лабораторные 7 и 8: SNMPv3 с аутентификацией (SHA) и
# шифрованием (AES), сбор трафика интерфейсов для графиков.
# Пользователь v3 создаётся ролью Ansible через net-snmp-config
# (пароли хранятся в /var/lib/snmp/snmpd.conf, не здесь).
# ============================================================

# --- Общие параметры демона ---
agentAddress  udp:161
master        agentx

# --- Информация о системе (sysDescr/sysLocation/sysContact) ---
sysLocation   Second NAT subnet (192.168.200.0/24), VM2 agent host
sysContact    monitoring-admin@monitoring.local
sysServices   78

# --- Доступ только по SNMPv3 (authPriv = аутентификация + шифрование) ---
# Строка createUser генерируется Ansible; сюда попадает из
# /var/lib/snmp/snmpd.conf. Здесь задаём права группы:
#   мониторящий доступ к дереву view "viewall" только с priv
rouser  monitor  authPriv  -V viewall

# Разрешённые представления
view    viewall   included  .1     80

# --- Сбор данных об интерфейсах для графиков трафика (ЛР 8) ---
# ifTable/ifXTable доступны стандартными OID:
#   ifInOctets  1.3.6.1.2.1.2.2.1.10.<ifIndex>
#   ifOutOctets 1.3.6.1.2.1.2.2.1.16.<ifIndex>
# Zabbix шаблон "Network Generic Device by SNMP" строит по ним графики.

# --- Дополнительные данные системы ---
include_dir /etc/snmp/conf.d

disk        /              10%
load        12 10 5
extend      check_http[shell] /usr/bin/curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/

# --- CPU/память через утилиты pass_persist при необходимости ---
# passthrough OID 1.3.6.1.4.1.99999:
pass .1.3.6.1.4.1.99999.1 /usr/bin/printf 'STRING %s\n' "$(uptime -p)"

# --- Безопасность: запрет SNMPv1/v2c ---
# (community-строки не определяются намеренно — v1/v2c недоступны)
