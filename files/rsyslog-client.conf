# ============================================================
# rsyslog-client.conf — отправка логов по TLS с подхоста (ВМ 2)
# Лабораторная 3: Rsyslog + TLS. На узле устанавливается
# Ansible-шаблоном roles/agent-host/templates/rsyslog-client.conf.j2,
# который подставляет MAIN_HOST_IP и SYSLOG_TLS_PORT из .env.
# Этот файл — эталонный статичный вариант конфигурации.
# ============================================================

module(load="imuxsock")
module(load="imfile" Mode="inotify")   # чтение файловых логов приложений
module(load="omgnutls")

global(
    defaultNetstreamDriver="gtls"
    workDirectory="/var/lib/rsyslog-imptcp-client"
)

# --- Мониторинг журнала Apache/Nginx как пример файловых логов ---
input(
    type="imfile"
    File="/var/log/apache2/access.log"
    Tag="apache-access:"
    Severity="info"
    Facility="local6"
    PersistState="on"
)

# --- Отправка всех сообщений на основной хост по TLS ---
action(
    type="omfwd"
    target="MAIN_HOST_IP"            # заменяется Ansible
    port="6514"                      # SYSLOG_TLS_PORT из .env
    protocol="tcp"
    StreamDriver="gtls"
    StreamDriverMode="1"             # обязательный TLS
    StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="main-host.monitoring.local"
    queue(type="DiskAssisted" size="10000" maxdiskqueue="2GB")
    action.resumeRetryCount="-1"
)

*.*     /var/log/syslog
