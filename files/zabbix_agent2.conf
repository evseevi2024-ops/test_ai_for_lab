# ============================================================
# zabbix_agent2.conf — агент мониторинга на подхосте (ВМ 2)
# Лабораторная 2: Zabbix Agent 2 отправляет метрики на ВМ 1.
# Ansible переопределяет Server/ServerActive/Hostname значениями
# из .env (MAIN_HOST_IP, AGENT_HOST_IP).
# ============================================================

Pid=/run/zabbix/zabbix_agent2.pid
LogType=systemd
LogFileSize=0

# Разрешённые источники запросов (основной хост + localhost)
Server=MAIN_HOST_IP,127.0.0.1
ServerActive=MAIN_HOST_IP:10051

# Имя хоста должно совпадать с именем хоста в Zabbix Server
Hostname=agent-host-2

# Порт агента (доступен изнутри второй подсети; наружу не проброшен)
ListenPort=10050
ListenIp=0.0.0.0

# Безопасность: только пасивные проверки от сервера, активный режим включён
AllowKey=system.run[*]

# Пользовательские параметры (кастомный плагин из Docker, ЛР 4)
UnsafeUserParameters=1
UserParameter=custom.http.status,/usr/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/
UserParameter=custom.plugin.metrics,curl -s http://127.0.0.1:8888/metrics || echo 'plugin unavailable'

# Производительность
StartAgents=3
Timeout=15
BufferSize=200
RefreshActiveChecks=60

# TLS к серверу опционально (включается при развёрнутом step-ca):
# TLSConnect=psk
# TLSAccept=psk

Include=/etc/zabbix/zabbix_agent2.d/*.conf
ControlSocket=/tmp/agent2.sock
Include=./zabbix_agent2.d/plugins.d/*.conf
