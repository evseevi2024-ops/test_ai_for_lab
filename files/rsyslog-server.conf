# ============================================================
# rsyslog-server.conf — приём логов по TLS на основном хосте (ВМ 1)
# Лабораторная 3: Rsyslog + TLS (RFC 5425, порт 6514).
# Сертификаты генерируются scripts/generate-certs.sh и монтируются
# в контейнер/каталог /certs (ca.crt, server.crt, server.key).
# ============================================================

module(load="imuxsock")    # локальные сообщения

# --- Приём по TCP с TLS от подхостов ---
module(
    load="imtcp"
    streamDriver.name="gtls"
    streamDriver.mode="1"            # принудительный TLS (только шифрование)
    streamDriver.authMode="x509/name"# обязательная проверка сертификата клиента
    maxSessions="200"
)

global(
    defaultNetstreamDriver="gtls"
    inputTCPServerCertificate="/certs/server.crt"
    inputTCPPrivateKey="/certs/server.key"
    inputTCPCACert="/certs/ca.crt"
)

# Слушать стандартный порт syslog-over-TLS
input(
    type="imtcp"
    port="6514"
)

# --- Шаблон хранения: отдельный файл на каждый узел-источник ---
template(
    name="RemoteHostFile"
    type="string"
    string="/var/log/remote/%HOSTNAME%/syslog.log"
)

# --- Парсинг RFC5424 для последующей корреляции (ЛР 9) ---
module(load="mmutf8fix")

*.*     action(type="omfile" template="RemoteHostFile")

# --- Все полученные логи дублируем в Splunk через TCP 9997 (raw forwarder) ---
# (при отсутствии Splunk сообщения останутся в файлах выше)
template(name="RawFormat" type="string" string="%rawmsg%\n")
