---
# Роль agent-host: развёртывание компонентов подхоста (ВМ 2).
- name: Deploy AGENT host
  hosts: agent_hosts
  become: true
  vars:
    node_role: agent
    main_host_ip: "{{ lookup('env', 'MAIN_HOST_IP') | default('192.168.100.10', true) }}"
    agent_host_ip: "{{ lookup('env', 'AGENT_HOST_IP') | default('192.168.200.20', true) }}"
  roles:
    - agent-host
