---
# roles/agent-host: обработчики
- name: Restart zabbix-agent2
  ansible.builtin.systemd_service:
    name: zabbix-agent2
    state: restarted

- name: Restart snmpd
  ansible.builtin.systemd_service:
    name: snmpd
    state: restarted

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Restart web server
  ansible.builtin.systemd_service:
    name: "{{ web_server }}"
    state: restarted
