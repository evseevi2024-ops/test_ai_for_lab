# ============================================================
# Ansible-инвентарь: хосты роли ОСНОВНОГО сервера (ВМ 1)
# Zabbix Server + PostgreSQL, Splunk, Rsyslog-server (TLS), step-ca
# IP подставляется из .env через deploy.sh (-e main_host_ip=...)
# ============================================================

[main_hosts]
main ansible_host=${MAIN_HOST_IP=192.168.100.10} ansible_connection=local

[main_hosts:vars]
ansible_python_interpreter=/usr/bin/python3
node_role=main
